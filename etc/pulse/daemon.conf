# OIR: hi-res izlaz (do 384 kHz / 32-bit) uz rate switching po streamu.
# avoid-resampling = yes -> PulseAudio reopen-uje uredjaj na rate streama
# (44.1k radio ostaje 44.1k, 384k WavPack ide kao 384k).
default-fragment-size-msec = 15
default-sample-format = float32le
default-sample-rate = 48000
alternate-sample-rate = 44100
avoid-resampling = yes
resample-method = soxr-vhq
